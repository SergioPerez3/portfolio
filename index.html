<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portfolio de Sergio Pérez Pérez, desarrollador Full-Stack Junior en Madrid: React, Node.js y MongoDB. Apps en producción con demo en vivo.">
<meta name="theme-color" content="#090b0f">
<meta property="og:title" content="Sergio Pérez · Desarrollador Full-Stack Junior">
<meta property="og:description" content="Apps completas con React, Node.js y MongoDB, desplegadas y listas para probar.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sergio-perez-dev.vercel.app/">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<title>Sergio Pérez · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: columna centrada de 1180px, hero tipográfico + dispositivo, proyectos en dos columnas alternas, timeline y contacto. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#0d1117; --mute:#5a6472; --line:#e1e5eb; --accent:#2f55ff; --accent-ink:#fff; --soft:#eceff4;
  --glass:rgba(255,255,255,.72); --shadow:0 30px 80px -30px rgba(20,30,60,.35); --grid:rgba(13,17,23,.05);
  --green:#17a06a; --purple:#7357ff; --gold:#d19a00;
  --futur:"Italiana","Inter Tight",system-ui,sans-serif; --display:"Inter Tight","Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090b0f; --surface:#10131a; --ink:#eef1f6; --mute:#8b94a4; --line:#1f242d; --accent:#7c97ff; --accent-ink:#0a0c10; --soft:#171b23;
  --glass:rgba(16,19,26,.72); --shadow:0 30px 80px -30px rgba(0,0,0,.8); --grid:rgba(255,255,255,.045);
  --green:#35d493; --purple:#9a85ff; --gold:#f0bd2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090b0f; --surface:#10131a; --ink:#eef1f6; --mute:#8b94a4; --line:#1f242d; --accent:#7c97ff; --accent-ink:#0a0c10; --soft:#171b23;
  --glass:rgba(16,19,26,.72); --shadow:0 30px 80px -30px rgba(0,0,0,.8); --grid:rgba(255,255,255,.045);
  --green:#35d493; --purple:#9a85ff; --gold:#f0bd2c; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;transition:background .5s,color .5s;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:var(--accent-ink)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.035em;line-height:1.02;font-weight:600}

/* fondo */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(600px 400px at var(--mx,70%) var(--my,10%),color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
.bgfx:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%)}
#prog{position:fixed;top:0;left:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--accent);z-index:60}

/* nav */
nav{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;width:min(920px,calc(100% - 32px));display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);transition:box-shadow .3s}
nav.scrolled{box-shadow:0 12px 40px -18px rgba(10,20,50,.35)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;letter-spacing:-.02em;margin-right:auto}
.brand img{width:28px;height:28px;border-radius:8px}
.brand span{white-space:nowrap}
.links{display:flex;gap:2px}
.links a{padding:7px 12px;border-radius:999px;font-size:14px;color:var(--mute);transition:.25s}
.links a:hover,.links a.on{color:var(--ink);background:var(--soft)}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mute);transition:.25s;font:500 12px var(--mono)}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib svg{width:17px;height:17px}
.cv{padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;white-space:nowrap;transition:.25s}
.cv:hover{background:var(--accent);color:var(--accent-ink)}
@media(max-width:760px){.links{display:none}.brand span{display:none}}

/* hero */
.hero{padding-top:clamp(110px,16vw,170px);overflow-x:clip;overflow-y:visible;padding-bottom:50px}
.status{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
h1.big{font-family:var(--futur);font-weight:400;font-size:clamp(3.2rem,9.6vw,9rem);line-height:1.08;letter-spacing:-.02em;margin-top:22px}
h1.big .ln{display:inline-block;overflow:hidden;padding:.04em .06em .3em 0;margin:0 .2em -.22em 0}
h1.big .ln>span{display:inline-block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
h1.big .ln:nth-child(2)>span{animation-delay:.12s;color:transparent;-webkit-text-stroke:1px var(--ink)}
@keyframes up{to{transform:none}}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:end;margin-top:26px}
.role{font:500 clamp(1.15rem,2.2vw,1.55rem)/1.3 var(--display);letter-spacing:-.02em}
.role em{font-style:normal;color:var(--accent)}
.lead{color:var(--mute);max-width:52ch;margin:14px 0 0;font-size:1.06rem}
.lead b{color:var(--ink);font-weight:500}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,color .25s,border-color .25s;will-change:transform}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.p:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:15px;height:15px;transition:transform .25s}
.btn:hover svg{transform:translate(2px,-2px)}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.cta{justify-content:flex-start}}

.cf{position:relative;height:clamp(300px,46vw,520px);margin-top:clamp(20px,4vw,50px);perspective:1600px;display:grid;place-items:center;overflow:visible}
.cf .rc{position:absolute;width:min(640px,66%);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000;display:block;box-shadow:0 40px 70px -30px rgba(0,0,0,.55);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s,box-shadow .5s;cursor:pointer}
.cf .rc.c0:hover{box-shadow:0 40px 80px -24px var(--c)}
.cf .view{aspect-ratio:16/10}
.cf .view img{transition:none;transform:none}
.cf .tag{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);font:500 13px var(--display);border:1px solid var(--line)}
.cf .tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cf .go{position:absolute;right:14px;top:14px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;opacity:0;transform:translateY(-6px);transition:.3s}
.cf .rc.c0:hover .go{opacity:1;transform:none}
.cfb{position:absolute;top:50%;margin-top:-22px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;transition:.25s}
.cfb:hover{background:var(--ink);color:var(--bg)}
.cfd{position:absolute;bottom:-34px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:20}
.cfd button{width:26px;height:3px;border-radius:3px;background:var(--line);padding:0;transition:.3s}
.cfd button.on{background:var(--accent);width:40px}
@media(max-width:700px){.cfb{display:none}.cf .rc{width:78%}}

/* dispositivos */
.dev{transform:perspective(1400px) rotateY(calc(var(--rx,0)*3deg)) rotateX(calc(var(--ry,0)*-2.4deg));transition:transform .25s ease-out;transform-style:preserve-3d}
.laptop .lid{background:linear-gradient(160deg,#2b3038,#14171c);border-radius:16px 16px 6px 6px;padding:11px 11px 13px;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.08);position:relative}
.laptop .lid:before{content:"";position:absolute;top:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#0a0c0f;box-shadow:inset 0 0 0 1px #343a44}
.laptop .base{height:13px;margin:0 -3.5%;border-radius:0 0 18px 18px;background:linear-gradient(#cfd4dc,#9aa2ae);position:relative;box-shadow:0 18px 30px -12px rgba(0,0,0,.45)}
:root[data-theme="dark"] .laptop .base{background:linear-gradient(#59606c,#2d323b)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .laptop .base{background:linear-gradient(#59606c,#2d323b)}}
.laptop .base:before{content:"";position:absolute;left:50%;top:0;width:16%;height:5px;margin-left:-8%;border-radius:0 0 8px 8px;background:rgba(0,0,0,.28)}
.screen{background:#000;border-radius:7px;overflow:hidden;position:relative}
.chrome{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#1b1f26}
.chrome i{width:8px;height:8px;border-radius:50%;background:#3a404a}
.chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
.chrome em{margin-left:10px;font:400 11px var(--mono);color:#98a1af;background:#0f1217;border-radius:6px;padding:3px 12px;flex:1;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.view{position:relative;overflow:hidden;width:100%;aspect-ratio:16/9.9}
.phone{background:linear-gradient(160deg,#2b3038,#101318);border-radius:34px;padding:9px;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.1);position:relative}
.phone .screen{border-radius:26px}
.phone:before{content:"";position:absolute;z-index:3;top:16px;left:50%;width:30%;height:14px;margin-left:-15%;border-radius:10px;background:#050607}
.phone .view{aspect-ratio:520/957}
.view img{position:absolute;opacity:0;transform:scale(1.03);transition:opacity .7s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);user-select:none;-webkit-user-drag:none}
.view img.on{opacity:1;transform:none}
.view iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.view .load{position:absolute;inset:0;display:grid;place-items:center;color:#8d96a5;font:400 12px var(--mono);background:linear-gradient(110deg,#0d1015 30%,#161a21 50%,#0d1015 70%);background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* secciones */
section{padding-top:clamp(80px,12vw,150px)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(36px,6vw,70px)}
.sh h2{font-size:clamp(2.2rem,5.5vw,4.4rem)}
.sh p{color:var(--mute);max-width:44ch;margin:0}

/* marquee */
.marq{margin-top:clamp(60px,9vw,110px);border-block:1px solid var(--line);overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq div{display:flex;gap:46px;width:max-content;padding:20px 0;animation:mq 38s linear infinite}
.marq:hover div{animation-play-state:paused}
.marq span{font:500 clamp(1.1rem,2.4vw,1.6rem) var(--display);letter-spacing:-.02em;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:46px}
.marq span:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}

/* datos */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:clamp(36px,6vw,64px)}
.facts div{background:var(--surface);padding:24px 26px}
.facts b{display:block;font:600 clamp(2rem,4vw,3rem)/1 var(--display);letter-spacing:-.04em}
.facts span{display:block;margin-top:8px;color:var(--mute);font-size:14px}
@media(max-width:760px){.facts{grid-template-columns:1fr 1fr}}

/* proyectos */
.proj{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,72px);align-items:center;padding-block:clamp(40px,7vw,90px);border-top:1px solid var(--line)}
.proj:nth-child(even){grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.proj:nth-child(even) .pt{order:2}
.proj .pt{min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.proj h3{font-size:clamp(2.6rem,6vw,5rem);margin-top:14px;letter-spacing:-.05em}
.proj h3 b{color:var(--c);font-weight:inherit}
.proj .sub{color:var(--mute);margin:16px 0 0;font-size:1.05rem}
.plinks{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.tabs{margin-top:30px}
.tl{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tl button{padding:0 0 12px;color:var(--mute);font-size:14px;font-weight:500;position:relative;transition:color .25s}
.tl button:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--c);transform:scaleX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-origin:0 50%}
.tl button[aria-selected=true]{color:var(--ink)}
.tl button[aria-selected=true]:after{transform:none}
.panel{padding-top:18px;min-height:210px;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.feat li{display:flex;gap:12px;font-size:15px;color:var(--ink)}
.feat li:before{content:"";flex:none;width:6px;height:6px;margin-top:.62em;border-radius:50%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font:400 13px var(--mono);background:var(--surface);transition:.25s}
.chip:hover{border-color:var(--c);transform:translateY(-2px)}
.diagram svg{width:100%;height:auto;display:block}
.d-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.d-t{fill:var(--ink);font:600 14px var(--display)}
.d-s{fill:var(--mute);font:400 11px var(--mono)}
.d-l{stroke:var(--c);stroke-width:1.6;fill:none;stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
.d-a{fill:var(--c)}
@keyframes dash{to{stroke-dashoffset:-20}}

.pv{min-width:0;position:relative}
.pv:before{content:"";position:absolute;inset:6% 4% 0;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 24%,transparent),transparent);filter:blur(34px);z-index:-1}
.ctrl{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.seg{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);position:relative}
.seg button{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mute);position:relative;z-index:1;transition:color .3s,background .3s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stage{display:flex;justify-content:center;min-height:200px}
.stage .dev{width:100%}
.stage .dev.ph{width:min(300px,64%)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.thumbs button{position:relative;overflow:hidden;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--mute);border:1px solid transparent;transition:.25s}
.thumbs button:hover{color:var(--ink);border-color:var(--line)}
.thumbs button[aria-current=true]{color:var(--ink);background:var(--surface);border-color:var(--line)}
.thumbs button i{position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--c);transform:scaleX(0);transform-origin:0 50%}
.thumbs button[aria-current=true] i{animation:bar var(--d,3.8s) linear forwards}
.paused .thumbs button[aria-current=true] i{animation-play-state:paused}
@keyframes bar{to{transform:scaleX(1)}}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:16px 0 0;min-height:20px}
@media(max-width:960px){.proj,.proj:nth-child(even){grid-template-columns:minmax(0,1fr)}.proj:nth-child(even) .pt{order:0}}

/* sobre mí */
.about{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(30px,6vw,90px)}
.about h2{font-size:clamp(2.2rem,5.5vw,4.4rem)}
.about p{color:var(--mute);font-size:1.08rem;max-width:56ch}
.about p:first-of-type{margin-top:28px;color:var(--ink)}
.tline{position:relative;padding-left:34px;display:grid;gap:34px;align-content:start}
.tline:before,.tline .fill{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tline .fill{background:var(--accent);bottom:auto;height:var(--h,0%);max-height:calc(100% - 12px);transition:height .15s linear}
.tline div{position:relative}
.tline div:before{content:"";position:absolute;left:-34px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:.4s}
.tline div.on:before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 20%,transparent)}
.tline b{display:block;font:600 1.25rem var(--display);letter-spacing:-.02em}
.tline span{color:var(--mute);font-size:14px}
@media(max-width:860px){.about{grid-template-columns:1fr}}

/* stack */
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:28px;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 24px 50px -30px rgba(30,50,120,.45)}
.card h3{font-size:1.35rem;letter-spacing:-.02em;margin-bottom:16px}
@media(max-width:900px){.stk{grid-template-columns:1fr}}

/* contacto */
.contact{margin-top:clamp(80px,12vw,150px);padding:clamp(34px,6vw,80px);border-radius:32px;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
.contact:before{content:"";position:absolute;width:520px;height:520px;right:-140px;top:-200px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 55%,transparent),transparent);filter:blur(10px);animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-80px,60px)}}
.contact>*{position:relative}
.contact h2{font-size:clamp(2.6rem,7vw,6rem);letter-spacing:-.05em}
.contact p{max-width:52ch;opacity:.7;margin:20px 0 0}
.mail{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:34px}
.mail code{font:400 clamp(.95rem,2vw,1.25rem) var(--mono);padding:14px 20px;border-radius:999px;border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);word-break:break-all}
